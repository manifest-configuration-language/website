server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  add_header_inherit merge;
  include /etc/nginx/security-headers.conf;

  location ~ "^/_astro/mcl\.wasm-[A-Za-z0-9_-]{8,}\.gz$" {
    types { application/wasm gz; }
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ "^/_astro/.+\.[A-Za-z0-9_-]{8,}\.(?:avif|css|gif|ico|jpe?g|js|png|svg|wasm|webp|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* "\.(?:wasm|js)$" {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* "\.html$" {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
