apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcl-website
  labels:
    app.kubernetes.io/name: mcl-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcl-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcl-website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcl-website
          image: mcl-website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcl-website
  labels:
    app.kubernetes.io/name: mcl-website
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcl-website
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
