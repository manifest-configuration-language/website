[tools]
node = "24.22.0"
pnpm = "12.14.0"
go = "1.27.3"
jactionlint = "2.2.0"

[tasks."actions:lint"]
description = "Lint GitHub Actions workflows"
run = "jactionlint .github/workflows/*.yml"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
depends = ["install"]
run = "pnpm run dev"

[tasks.build]
run = "pnpm run build"

[tasks.lint]
run = "pnpm run lint"

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks."format:check"]
run = "pnpm run format:check"
