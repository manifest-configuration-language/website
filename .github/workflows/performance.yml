name: Website performance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      record_baseline:
        description: Capture a reviewed baseline candidate instead of comparing to the committed baseline
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Measure performance and enforce budgets
        if: ${{ !inputs.record_baseline }}
        run: |
          set -o pipefail
          node scripts/measure-performance.mjs | tee performance.json >> "$GITHUB_STEP_SUMMARY"
      - name: Capture performance baseline candidate
        if: ${{ inputs.record_baseline }}
        run: |
          set -o pipefail
          node scripts/measure-performance.mjs --record-baseline=performance-baseline.candidate.json | tee performance.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-performance-${{ github.run_id }}
          path: |
            performance.json
            performance-baseline.candidate.json
          if-no-files-found: ignore
          retention-days: 30
