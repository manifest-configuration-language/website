name: Website

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/manifest-configuration-language/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: mcl-website:ci
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mcl-website-main
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=mcl-website-main,mode=max' || '' }}

      - name: Save production image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: docker save mcl-website:ci -o /tmp/mcl-website.tar

      - name: Upload production image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-container-${{ github.sha }}
          path: /tmp/mcl-website.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/manifest-configuration-language/website
    steps:
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download production image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: website-container-${{ github.sha }}
          path: /tmp/website-container

      - name: Load and publish production image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          docker load -i /tmp/website-container/mcl-website.tar
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker tag mcl-website:ci "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
          image_ref="$(docker image inspect "${IMAGE_TAGS%%$'\n'*}" --format '{{index .RepoDigests 0}}')"
          image_digest="${image_ref##*@}"
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf 'Published image: %s@%s\n' "$IMAGE_NAME" "$image_digest"

      - name: Record published image reference
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf 'Published image: %s@%s\nSource ref: %s\nTags:\n%s\n' \
            "$IMAGE_NAME" "$IMAGE_DIGEST" "$GITHUB_REF" "$IMAGE_TAGS" \
            >> "$GITHUB_STEP_SUMMARY"
          printf 'Published image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"

      - name: Attest image provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
