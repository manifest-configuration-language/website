add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' {{SCRIPT_HASHES}}; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Referrer-Policy no-referrer always;
