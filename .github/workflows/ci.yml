name: Website

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - run: pnpm audit --audit-level=high
      - run: pnpm run verify:docs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm run test:project-validation
      - parallel:
          - name: Lint website
            run: pnpm run lint
          - name: Check formatting
            run: pnpm run format:check
          - name: Check TypeScript
            run: pnpm run typecheck
          - name: Lint GitHub Actions workflows
            run: mise run actions:lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - run: pnpm exec playwright install --with-deps
      - run: pnpm run test:e2e
      - name: Measure performance and enforce budgets
        run: pnpm run measure:performance

      - name: Upload pull request preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-preview-pr-${{ github.event.pull_request.number }}
          path: .build/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Link the pull request preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: echo "[Download the built site preview]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments --index-files index.md --fallback-extensions md --root-dir "$GITHUB_WORKSPACE/src/content/docs" src/content/docs

  container:
    needs: [verify, e2e, links]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcl-website:ci
          cache-from: type=gha,scope=mcl-website
          cache-to: type=gha,scope=mcl-website,mode=max

      - name: Run image with a read-only root filesystem
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --read-only --cap-drop=ALL --security-opt=no-new-privileges --user 101:101 --tmpfs /tmp:rw,noexec,nosuid,size=16m --publish 127.0.0.1:8080:8080 mcl-website:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header /tmp/mcl-website.headers --output /tmp/mcl-website.html http://127.0.0.1:8080/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          grep -qi '^HTTP/[^ ]* 200' /tmp/mcl-website.headers
          grep -qi '<title>MCL' /tmp/mcl-website.html
          grep -qi "^Content-Security-Policy:.*default-src 'self'.*frame-ancestors 'none'" /tmp/mcl-website.headers
          grep -qi "^Content-Security-Policy:.*form-action 'self'" /tmp/mcl-website.headers
          grep -qi '^Cross-Origin-Resource-Policy: same-origin' /tmp/mcl-website.headers
          grep -qi '^Referrer-Policy: no-referrer' /tmp/mcl-website.headers
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/mcl-website.headers
          grep -qi '^Permissions-Policy: camera=(), microphone=(), geolocation=()' /tmp/mcl-website.headers

          curl --fail --silent --show-error --header 'Accept-Encoding: gzip' --dump-header /tmp/mcl-website-gzip.headers --output /tmp/mcl-website.html.gz http://127.0.0.1:8080/
          grep -qi '^HTTP/[^ ]* 200' /tmp/mcl-website-gzip.headers
          grep -qi '^Content-Encoding: *gzip' /tmp/mcl-website-gzip.headers
          grep -qi '^Vary:.*Accept-Encoding' /tmp/mcl-website-gzip.headers
          gzip -t /tmp/mcl-website.html.gz
          gzip -dc /tmp/mcl-website.html.gz > /tmp/mcl-website-gzip.html
          cmp /tmp/mcl-website.html /tmp/mcl-website-gzip.html

          js_url="$(grep -oE '/_astro/[^" ]+\.js' /tmp/mcl-website.html | sed -n '1p')"
          [ -n "$js_url" ]
          curl --fail --silent --show-error --header 'Accept-Encoding: gzip' --dump-header /tmp/mcl-website-js-gzip.headers --output /tmp/mcl-website.js.gz "http://127.0.0.1:8080${js_url}"
          grep -qi '^Content-Type: *application/javascript' /tmp/mcl-website-js-gzip.headers
          grep -qi '^Content-Encoding: *gzip' /tmp/mcl-website-js-gzip.headers
          gzip -t /tmp/mcl-website.js.gz

          wasm_url="$(docker exec "$container_id" sh -c "grep -RhoE '/_astro/mcl\\.wasm-[A-Za-z0-9_-]{8,}\\.gz' /usr/share/nginx/html/_astro/*.js | sed -n '1p' | sed 's/\\.gz$/.wasm/'")"
          [ -n "$wasm_url" ]
          curl --fail --silent --show-error --header 'Accept-Encoding: gzip' --dump-header /tmp/mcl-website-wasm.headers --output /tmp/mcl-website-wasm.gz "http://127.0.0.1:8080${wasm_url}"
          grep -qi '^HTTP/[^ ]* 200' /tmp/mcl-website-wasm.headers
          grep -qi '^Content-Type: *application/wasm' /tmp/mcl-website-wasm.headers
          grep -qi '^Content-Encoding: *gzip' /tmp/mcl-website-wasm.headers
          grep -qi '^Vary:.*Accept-Encoding' /tmp/mcl-website-wasm.headers
          grep -qi '^Cache-Control:.*max-age=31536000.*immutable' /tmp/mcl-website-wasm.headers
          gzip -t /tmp/mcl-website-wasm.gz
          gzip -dc /tmp/mcl-website-wasm.gz > /tmp/mcl-website.wasm
          wasm_magic="$(od -An -tx1 -N4 /tmp/mcl-website.wasm | tr -d ' \n')"
          [ "$wasm_magic" = 0061736d ]

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/manifest-configuration-language/website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-to: type=gha,scope=mcl-website,mode=max

      - name: Record published image reference
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf 'Published image: %s@%s\nSource ref: %s\nTags:\n%s\n' \
            "$IMAGE_NAME" "$IMAGE_DIGEST" "$GITHUB_REF" "$IMAGE_TAGS" \
            >> "$GITHUB_STEP_SUMMARY"
          printf 'Published image: %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST"

      - name: Attest image provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
