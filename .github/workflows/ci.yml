name: Website

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - run: pnpm audit --audit-level=high
      - run: pnpm run verify:docs
      - run: pnpm run test:project-validation
      - parallel:
          - name: Lint website
            run: pnpm run lint
          - name: Check formatting
            run: pnpm run format:check
          - name: Check TypeScript
            run: pnpm run typecheck
          - name: Lint GitHub Actions workflows
            run: mise run actions:lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - run: mise run install
      - run: pnpm exec playwright install --with-deps
      - run: pnpm run test:e2e

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments --index-files index.md --fallback-extensions md --root-dir "$GITHUB_WORKSPACE/src/content/docs" src/content/docs

  container:
    needs: [verify, e2e, links]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcl-website:ci
          cache-from: type=gha,scope=mcl-website
          cache-to: type=gha,scope=mcl-website,mode=max

      - name: Run image with a read-only root filesystem
        run: |
          set -eu
          container_id="$(docker run --detach --read-only --user 101:101 --tmpfs /tmp:rw,noexec,nosuid,size=16m --publish 127.0.0.1:8080:8080 mcl-website:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header /tmp/mcl-website.headers --output /tmp/mcl-website.html http://127.0.0.1:8080/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          grep -qi '^HTTP/[^ ]* 200' /tmp/mcl-website.headers
          grep -qi '<title>MCL' /tmp/mcl-website.html
          grep -qi "^Content-Security-Policy:.*default-src 'self'.*frame-ancestors 'none'" /tmp/mcl-website.headers
          grep -qi '^Cross-Origin-Resource-Policy: same-origin' /tmp/mcl-website.headers
          grep -qi '^Referrer-Policy: no-referrer' /tmp/mcl-website.headers
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/mcl-website.headers
          grep -qi '^Permissions-Policy: camera=(), microphone=(), geolocation=()' /tmp/mcl-website.headers

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/manifest-configuration-language/website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-to: type=gha,scope=mcl-website,mode=max

      - name: Report main image reference
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image_ref="${IMAGE_NAME}:main@${IMAGE_DIGEST}"
          echo "Published image: ${image_ref}"
          printf 'Published image: %s\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest image provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
