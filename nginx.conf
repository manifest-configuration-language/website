server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  location ~* "^/_astro/.+\.[a-f0-9]{8,}\.(?:js|css|svg|woff2)$" {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location ~* "\.(?:wasm|js)$" {
    expires 0;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* "\.html$" {
    expires 0;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
